[project]
name = "skill-library-project-management"
version = "3.1.0"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["skills/deep-plan/script"]
python_files = ["test_*.py"]
cache_dir = ".uv-cache/pytest"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
